services:
  db:
    image: postgres:16-alpine
    container_name: baraka-fish-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: baraka
      POSTGRES_PASSWORD: baraka
      POSTGRES_DB: baraka_fish
    ports:
      - '5432:5432'
    volumes:
      - baraka_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U baraka -d baraka_fish']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  baraka_pgdata:
